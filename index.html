<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tomasz Pragłowski</title>
<meta name="description" content="Wizytówka internetowa Tomasza Pragłowskiego" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script>
  (function () {
    try {
      var pref = localStorage.getItem("theme-preference") || "auto";
      var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div class="loader" id="loader" aria-hidden="true">
    <span class="loader__brand">Tpraglowski</span>
    <span class="loader__spinner"></span>
  </div>

  <div class="bg" aria-hidden="true">
    <div class="bg__layer bg__layer--light"></div>
    <div class="bg__layer bg__layer--dark"></div>
  </div>
  <div class="bg-glow" aria-hidden="true"></div>

  <button type="button" class="social-btn settings-toggle reveal" style="--reveal-delay: 0ms" id="settingsToggle" aria-label="Ustawienia" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>

    </svg>
  </button>

  <h1 class="brand reveal" style="--reveal-delay: 60ms">Tpraglowski</h1>

  <main class="card reveal" style="--reveal-delay: 140ms">
    <div class="avatar" aria-hidden="true">
      <div class="avatar__layer avatar__layer--light"></div>
      <div class="avatar__layer avatar__layer--dark"></div>
    </div>
    <h2>Tomasz Pragłowski</h2>

    <button type="button" class="email-pill" id="emailCopy" data-email="tomek@praglowski.com" aria-label="Kopiuj adres e-mail tomek@praglowski.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/>
        <path d="M4 7l8 6 8-6"/>
      </svg>
      <span class="email-pill__label" id="emailCopyLabel">tomek@praglowski.com</span>
    </button>
  </main>

  <nav class="social-buttons reveal" style="--reveal-delay: 220ms">

    </a>

    <a class="social-btn" href="https://github.com/tpraglowski" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">

    </a>

    <a class="social-btn" href="https://tpraglowski.github.io/myschool/" target="_blank" rel="noopener" aria-label="MySchool" title="MySchool">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9s1.3-6.5 3.8-9Z"/>
      </svg>
    </a>

    <button type="button" class="social-btn" id="siteMenuToggle" aria-label="Moje strony" aria-expanded="false" aria-haspopup="dialog" title="Moje strony">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="6" cy="6" r="2.2"/><circle cx="12" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/>
        <circle cx="6" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="18" cy="12" r="2.2"/>
        <circle cx="6" cy="18" r="2.2"/><circle cx="12" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/>
      </svg>
    </button>
  </nav>

  <div class="menu-backdrop" id="menuBackdrop">
    <div class="site-menu" id="siteMenu" role="dialog" aria-label="Moje strony">
      <button type="button" class="site-menu__back" id="siteMenuBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Powrót do wizytówki
      </button>
      <ul>
        <li><a href="https://tpraglowski.github.io/myschool/" target="_blank" rel="noopener">MySchool</a></li>
        <li><a href="https://tpraglowski.github.io/business-card/">Wizytówka</a></li>
      </ul>
    </div>
  </div>

  <div class="menu-backdrop" id="settingsBackdrop">
    <div class="site-menu" id="settingsPanel" role="dialog" aria-label="Ustawienia">
      <button type="button" class="site-menu__back" id="settingsBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Powrót do wizytówki
      </button>
      <p class="settings-label">Tryb wyświetlania</p>
      <div class="theme-switch" role="radiogroup" aria-label="Tryb wyświetlania">
        <span class="theme-switch__thumb" id="themeThumb" aria-hidden="true"></span>
        <button type="button" class="theme-option" data-theme-value="light" role="radio">
          <span class="theme-option__icon" aria-hidden="true">☀️</span>
          <span>Jasny</span>
        </button>
        <button type="button" class="theme-option" data-theme-value="dark" role="radio">
          <span class="theme-option__icon" aria-hidden="true">🌙</span>
          <span>Ciemny</span>
        </button>
        <button type="button" class="theme-option" data-theme-value="auto" role="radio">
          <span class="theme-option__icon" aria-hidden="true">⚙️</span>
          <span>Automatyczny</span>
        </button>
      </div>
    </div>
  </div>

  <footer class="reveal" style="--reveal-delay: 280ms">
    <p>&copy; <span id="year"></span> Tomasz Pragłowski</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
